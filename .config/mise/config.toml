[settings]
auto_install = false
experimental = true
lockfile = true
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go", "java"]
python.uv_venv_auto = "source"
trusted_config_paths = ["~"]
npm.package_manager = "bun"
minimum_release_age = "0s"
activate_aggressive = true
system_packages.managers = ["brew", "brew-cask"]
dotfiles.root = "~/.config/mise/.dotfiles"
dotfiles.default_mode = "symlink"
env_shell_expand = true

[bootstrap.packages]
"brew:bash" = "latest"
"brew:container" = "latest"
"brew:git" = "latest"
"brew:gnupg" = "latest"
"brew:hf" = "latest"
"brew:mole" = "latest"
"brew:python-build" = "latest"
"brew:ruby-build" = "latest"
"brew:starship" = "latest"
"brew:swift-format" = "latest"
"brew:zinit" = "latest"

