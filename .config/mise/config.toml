[tasks.generate-completions]
description = "生成常用工具的zsh补全"
run = '''
#!/usr/bin/env zsh
set -u

# 补全目录与缓存路径（未加载 dotfiles 时使用默认值兜底）
ZSH_COMPLETION_DIR="${ZSH_COMPLETION_DIR:-$HOME/.cache/zsh/site-functions}"
ZCOMPDUMP="${ZCOMPDUMP:-$HOME/.zcompdump}"
CONCURRENCY=8 # 并发上限，curl 下载较多，串行太慢

mkdir -p -- "$ZSH_COMPLETION_DIR"

# 清理旧的补全文件，避免过期或冲突
rm -f -- "$ZSH_COMPLETION_DIR"/_* 2>/dev/null

echo "🔄 生成常用工具的zsh补全..."

# 辅助函数：检查命令是否存在并生成补全；失败或输出为空时清理残留文件
gen_completion() {
    local name="$1" cmd="$2"
    local target="$ZSH_COMPLETION_DIR/_${name}"

    if ! [ -x "$(command -v "$name" 2>/dev/null)" ]; then
        echo "⏭️  ${name} 未安装，跳过"
        return
    fi

    if eval "$cmd" > "$target" 2>/dev/null && [[ -s "$target" ]]; then
        echo "✅ ${name} 补全脚本已生成"
    else
        rm -f -- "$target"
        echo "❌ ${name} 补全生成失败"
    fi
}

# 后台并发执行，超过上限时等待最早完成的任务
PENDING=0
spawn() {
    gen_completion "$@" &
    PENDING=$((PENDING + 1))
    if (( PENDING >= CONCURRENCY )); then
        wait -n 2>/dev/null
        PENDING=$((PENDING - 1))
    fi
}

CURL="curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 20"

spawn hermes "hermes completion zsh"
spawn aube "aube completion zsh"
spawn bat "bat --completion zsh"
spawn bun "bun completions zsh"
spawn miniserve "miniserve --print-completions zsh"
spawn deno "deno completions zsh"
spawn fd "fd --gen-completions zsh"
spawn gh "gh completion -s zsh"
spawn opencode "opencode completion"
spawn npm "npm completion"
spawn pkl "pkl shell-completion zsh"
spawn pnpm "pnpm completion zsh"
spawn pip "pip completion --zsh"
spawn rg "rg --generate complete-zsh"
spawn usage "usage --completions zsh"
spawn uv "uv generate-shell-completion zsh"
spawn watchexec "watchexec --completions zsh"
spawn yq "yq completion zsh"
spawn pitchfork "pitchfork completion zsh"
spawn hf "hf --show-completion"
spawn container "container --generate-completion-script zsh"
spawn kubectl "kubectl completion zsh"
spawn witr "witr completion zsh"
spawn yarn "$CURL https://raw.githubusercontent.com/zsh-users/zsh-completions/refs/heads/master/src/_yarn"
spawn claude "$CURL https://raw.githubusercontent.com/1160054/claude-code-zsh-completion/refs/heads/main/completions/_claude.zh-CN"
spawn mlx_lm.server "$CURL https://raw.githubusercontent.com/ftzahao/config/refs/heads/main/zsh-completion/mlx_lm.server/_mlx_lm.server.zh-CN"
spawn mlx_lm.chat "$CURL https://raw.githubusercontent.com/ftzahao/config/refs/heads/main/zsh-completion/mlx_lm.chat/_mlx_lm.chat.zh-CN"
spawn mlx_lm.dynamic_quant "$CURL https://raw.githubusercontent.com/ftzahao/config/refs/heads/main/zsh-completion/mlx_lm.dynamic_quant/_mlx_lm.dynamic_quant.zh-CN"

wait

echo ""
echo "✅ 所有补全内容已生成至 $ZSH_COMPLETION_DIR"

# 刷新补全缓存，让新补全对后续会话立即生效
fpath=("$ZSH_COMPLETION_DIR" $fpath)
autoload -Uz compinit
compinit -d "$ZCOMPDUMP"
'''

[tasks.mise-update]
description = "更新mise的包到最新版本"
run = "mise cache clear && mise upgrade --bump"

[tasks.install-x64]
description = "安装64位系统的工具包: mise run install-x64 [tool@version]"
env = { MISE_ARCH = "x86_64" }
run = "mise install"

[tasks.install-node-14-arm64]
description = "仅用于安装 arm64 版本的 Node 14（走非官方镜像源）"
env = { MISE_NODE_MIRROR_URL = "https://nodejs.raccoon-tw.dev/release/", MISE_NODE_VERIFY = 0 }
run = "mise install node@14"

[tasks.hf-i-mlx]
description = "使用 hf ci 下载模型到 ~/MLXModels"
run = '''
#!/usr/bin/env zsh

echo "> 模型仓库: https://huggingface.co/$1"
echo "> hf download $1 --local-dir ~/.cache/MLXModels/$1"
hf download $1 --local-dir ~/.cache/MLXModels/$1
'''
