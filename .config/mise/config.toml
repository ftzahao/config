[dotfiles]
"~/.zshenv/lang" = { block = '''
export LANG=zh_CN.UTF-8
export LC_ALL=zh_CN.UTF-8
''' }

"~/.zshenv/zsh_cache_folder" = { block = '''
export ZCOMPCACHE="$HOME/.cache/zsh/.zcompcache" # ZSH 补全缓存目录
export ZSH_COMPLETION_DIR="$HOME/.cache/zsh/.zfunc" # ZSH 补全脚本目录

function ensure_directory() {
  local dir="$1"
  if [ ! -d "$dir" ]; then
    mkdir -p -- "$dir" 2>/dev/null || {
      echo "Error: Failed to create directory '$dir'" >&2
      return 1
    }
  fi
}
ensure_directory "$ZCOMPCACHE"
ensure_directory "$ZSH_COMPLETION_DIR"
unset -f ensure_directory
''' }

"~/.zprofile/activate" = { block = '''
eval "$(/opt/homebrew/bin/brew shellenv zsh)"
eval "$(mise activate zsh --shims)"
''' }

"~/.zshrc/zinit" = { block = '''
. /opt/homebrew/opt/zinit/zinit.zsh
autoload -Uz _zinit
(( ${+_comps} )) && _comps[zinit]=_zinit
''' }

"~/.zshrc/path" = { block = '''
export PNPM_HOME="$HOME/.pnpm" # PNPM_HOME 环境变量
typeset -U path PATH  # 声明 PATH 为数组
path=(
 $PNPM_HOME/bin      # ~/.pnpm/bin
 $HOME/.local/bin    # 本地 bin 目录
 $path               # 原有路径
)
''' }

"~/.zshrc/history" = { block = '''
setopt HIST_EXPIRE_DUPS_FIRST # 当历史记录满时，优先删除重复的旧条目
setopt HIST_IGNORE_DUPS # 不记录与上一条相同的命令
setopt HIST_IGNORE_SPACE # 不记录以空格开头的命令
setopt HIST_VERIFY # 执行历史命令前先展开，允许用户确认或修改
setopt SHARE_HISTORY # 在所有 zsh 会话间实时共享历史记录
''' }

"~/.zshrc/activate" = { block = '''
[ -x "$(command -v mise)" ] && eval "$(mise activate zsh)"
[ -x "$(command -v starship)" ] && eval "$(starship init zsh)"
''' }

"~/.zshrc/aliases" = { block = '''
alias brew-update="brew update && brew upgrade --greedy && brew cleanup --prune 0" # 更新 Homebrew 包并清理旧版本
alias buz='brew uninstall --zap' # 卸载 Homebrew 包并清理相关文件
alias bi='brew install' # 安装 Homebrew 包
alias binfo='brew info' # 显示 Homebrew 包的信息
function brews() {
  local formulae="$(brew leaves | xargs brew deps --installed --for-each)"
  local casks="$(brew list --cask 2>/dev/null)"
  local blue="$(tput setaf 4)"
  local bold="$(tput bold)"
  local off="$(tput sgr0)"
  echo "${blue}==>${off} ${bold}Formulae${off}"
  echo "${formulae}" | sed "s/^\(.*\):\(.*\)$/\1${blue}\2${off}/"
  echo "\n${blue}==>${off} ${bold}Casks${off}\n${casks}"
} # 列出所有已安装的 Homebrew 包，包括依赖关系和版本信息
alias dns-update="sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder" # 清理 DNS 缓存
alias ip-local="ipconfig getifaddr en0" # 本机 IP 地址（局域网）
alias ip-v4-public="curl -s ifconfig.me && echo" # 获取本机 IPv4 地址（公网）
alias cdr='cd "$(git rev-parse --show-toplevel)"' # 切换到 Git 仓库的根目录
alias dsstore-clean="find . -name '.DS_Store' -type f -delete" # 清理 .DS_Store 文件
''' }

"~/.zshrc/completion" = { block = '''
fpath=($ZSH_COMPLETION_DIR $fpath)

autoload -Uz compinit
# 检查缓存文件是否在 24 小时内更新过
if [[ -n ${ZCOMPCACHE} && ! -n ${ZCOMPCACHE} && $(($(date +%s) - $(stat -f %m ${ZCOMPCACHE} 2>/dev/null || echo 0))) -lt 86400 ]]; then
 compinit -C
else
 compinit
fi

# --- zstyle 配置 ---
# 使用 _expand、_complete、_approximate 三个补全器，按顺序尝试：
# 1. _expand   — 先展开通配符/变量/历史扩展
# 2. _complete — 再做普通补全
# 3. _approximate — 最后允许模糊/近似匹配（容错）
zstyle ':completion:*' completer _expand _complete _approximate
 # 匹配规则（两条按顺序应用）：
# 1. m:{a-zA-Z}={A-Za-z}  — 大小写不敏感匹配（a↔A）
# 2. r:|[._-]=* r:|=*     — 在分隔符 . _ - 处做子串匹配，且允许光标后补全
zstyle ':completion:*' matcher-list \
'm:{a-zA-Z}={A-Za-z}' \
'r:|[._-]=* r:|=*'

setopt auto_menu # 启用“二次 Tab 进菜单”，有多个候选时自动进入交互式菜单
zstyle ':completion:*' menu select # 菜单模式改为“高亮选择”（可用方向键），而非单纯循环
zstyle ':completion:*' group-name '' # 不显示分组标题（如 "commands" "files" 等分组名）
zstyle ':completion:*' insert-unambiguous true # 只有在补全无歧义时才自动插入；有歧义则停在菜单让你选
zstyle ':completion:*' list-colors ${(s.:.)LS_COLORS} # 用 LS_COLORS 给补全列表上色（目录蓝、可执行绿等）
zstyle ':completion:*' use-cache yes # 启用补全缓存，加速二次补全
zstyle ':completion:*' cache-path "$ZCOMPCACHE" # 缓存目录指向 $ZCOMPCACHE 变量
zstyle ':completion:*' rehash true # 每次补全前自动 rehash，确保新安装的命令立即可补全
zstyle ':completion:*' sort true # 补全结果排序（字母序）
zstyle ':completion:*:history-words' stop yes # 历史词补全时，遇到停止词（如 ; & |）就停止，不再继续补全
zstyle ':completion:*:cd:*' ignore-parents parent pwd # cd 补全时忽略父目录 (..) 和当前目录 (.)，避免误选
zstyle ':completion:*:kill:*' command 'ps -u $USER -o pid,cmd' # kill 补全进程时，用自定义 ps 格式显示 PID 和命令名
''' }

"~/.zshrc/plugin" = { block = '''
# zinit ice wait lucid
zinit light zsh-users/zsh-autosuggestions

zinit ice wait lucid
zinit light zdharma-continuum/fast-syntax-highlighting

