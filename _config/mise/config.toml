  # "~/.config/mise/env/claude/xiaomi.yaml",
  # "~/.config/mise/env/claude/z.ai.yaml",
], expand = true }
_.path = { paths = [], tools = true }

[dotfiles]
"~/.zshenv/lang" = { block = '''
export LANG="zh_CN.UTF-8"
export LC_ALL="zh_CN.UTF-8"
''' }

"~/.zshenv/path" = { block = '''
path+=("$HOME/.local/bin")
''' }

"~/.zshenv/zsh_cache_folder" = { block = '''
export ZSH_COMPLETION_DIR="$HOME/.cache/zsh/site-functions" # ZSH 补全脚本目录

function ensure_directory() {
  local dir="$1"
  if [ ! -d "$dir" ]; then
    mkdir -p -- "$dir" 2>/dev/null || {
      echo "Error: Failed to create directory '$dir'" >&2
      return 1
    }
  fi
}
ensure_directory "$ZSH_COMPLETION_DIR"
unset -f ensure_directory
''' }

"~/.zprofile/activate" = { block = '''
eval "$(/opt/homebrew/bin/brew shellenv zsh)"
# eval "$(mise activate zsh --shims)"
''' }

"~/.zshrc/zinit" = { block = '''
. /opt/homebrew/opt/zinit/zinit.zsh
autoload -Uz _zinit
(( ${+_comps} )) && _comps[zinit]=_zinit
''' }

"~/.zshrc/history" = { block = '''
setopt HIST_EXPIRE_DUPS_FIRST # 当历史记录满时，优先删除重复的旧条目
setopt HIST_IGNORE_DUPS # 不记录与上一条相同的命令
setopt HIST_IGNORE_SPACE # 不记录以空格开头的命令
setopt HIST_VERIFY # 执行历史命令前先展开，允许用户确认或修改
setopt SHARE_HISTORY # 在所有 zsh 会话间实时共享历史记录
setopt HIST_IGNORE_ALL_DUPS # 重复记录只保留最新一条
''' }

"~/.zshrc/activate" = { block = '''
[ -x "$(command -v mise)" ] && eval "$(mise activate zsh)"
[ -x "$(command -v starship)" ] && eval "$(starship init zsh)"
''' }

"~/.zshrc/aliases" = { block = '''
alias brew-update="brew update && brew upgrade --greedy && brew cleanup --prune 0" # 更新 Homebrew 包并清理旧版本
alias buz='brew uninstall --zap' # 卸载 Homebrew 包并清理相关文件
alias bi='brew install' # 安装 Homebrew 包
alias binfo='brew info' # 显示 Homebrew 包的信息
function brews() {
  local formulae="$(brew leaves | xargs brew deps --installed --for-each)"
  local casks="$(brew list --cask 2>/dev/null)"
  local blue="$(tput setaf 4)"
  local bold="$(tput bold)"
  local off="$(tput sgr0)"
  echo "${blue}==>${off} ${bold}Formulae${off}"
  echo "${formulae}" | sed "s/^\(.*\):\(.*\)$/\1${blue}\2${off}/"
  echo "\n${blue}==>${off} ${bold}Casks${off}\n${casks}"
} # 列出所有已安装的 Homebrew 包，包括依赖关系和版本信息
alias dns-update="sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder" # 清理 DNS 缓存
alias ip-local="ipconfig getifaddr en0" # 本机 IP 地址（局域网）
alias ip-v4-public="curl -fsSL 4.ipcheck.ing/geo | yq --output-format toml" # 获取本机 IPv4 地址（公网）
alias ip-v6-public="curl -fsSL 4.ipcheck.ing/geo | yq --output-format toml" # 获取本机 IPv6 地址（公网）
alias ip-net-public="curl -fsSL 64.ipcheck.ing/geo | yq --output-format toml" # 获取本机优先网络出口的 IP 地址（公网）
alias cdr='cd "$(git rev-parse --show-toplevel)"' # 切换到 Git 仓库的根目录
alias dsstore-clean="find . -name '.DS_Store' -type f -delete" # 清理 .DS_Store 文件
''' }

"~/.zshrc/completion" = { block = '''
# ============================================================
# zsh 补全系统
# ============================================================
# 用户补全目录加入 fpath（目录不存在时不加，避免 fpath 混入无效路径）
[[ -d "$ZSH_COMPLETION_DIR" ]] && fpath+=("$ZSH_COMPLETION_DIR")

autoload -Uz compinit
_comp_dump="${XDG_CACHE_HOME:-$HOME/.cache}/zsh/zcompdump-$ZSH_VERSION"
mkdir -p -- "${_comp_dump:h}"

# compinit 分级加载：dump 超过 24 小时才做一次全量 compinit
# （重扫 fpath 以发现新装补全 + compaudit 安全检查 + 重建 dump），
# 日常启动走 compinit -C 直接加载 dump，明显更快。
# 注意 -C 不会发现当天新装的补全，次日全量扫描自动兜底；
# 新装补全想立即生效可执行：rm "$_comp_dump" && exec zsh
for _comp_stale in "$_comp_dump"(N.mh+24); do
  compinit -d "$_comp_dump"
done
compinit -C -d "$_comp_dump"
unset _comp_dump _comp_stale

# ---- 编辑行为（配合补全）----
setopt auto_menu                       # 多次 Tab 在备选项间循环
setopt always_to_end                   # 插入补全后光标移到词尾
setopt complete_in_word                # 光标在词中也可补全（不开则光标自动跳词尾，_prefix 补全器形同虚设）
zmodload zsh/complist                  # menu select 的交互由此模块提供
bindkey -M menuselect '\e[Z' reverse-menu-complete   # 菜单里 Shift+Tab 反向选择

# ---- 补全器（按顺序尝试，形成回退链）----
# _expand       展开通配符 / 变量 / 历史扩展
# _complete     普通补全
# _match        基于模式匹配（处理 *xxx 类的展开）
# _approximate  模糊 / 近似匹配（容错）
# _prefix       光标在词中也能补全（需配合上面的 complete_in_word）
zstyle ':completion:*' completer _expand _complete _match _approximate _prefix

# ---- 匹配规则（从精确到宽松，逐级回退）----
# 1. 精确匹配（空规则）
# 2. 大小写不敏感
# 3. 在 . _ - 处分段匹配，并允许光标后补全
zstyle ':completion:*' matcher-list \
  '' \
  'm:{[:lower:][:upper:]}={[:upper:][:lower:]}' \
  'r:|[._-]=* r:|=*'

# ---- 性能 ----
# 补全路径时逐段检查：前缀已是完整目录名就直接接受，不再试探它还能补全成什么，
# 大目录（如 node_modules、nix store）下补全提速明显
zstyle ':completion:*' accept-exact-dirs true
# _approximate 容错上限，默认 2；降为 1 模糊补全更快也更准（numeric = 按原始错误数计）
zstyle ':completion:*:approximate:*' max-errors 1 numeric

# ---- 菜单与交互 ----
zstyle ':completion:*' menu select     # 高亮选择，方向键 / Emacs 风格键可用

# ---- 列表显示 ----
# LS_COLORS 未设置（tmux / screen / ssh 等场景）回退到默认配色，避免 list-colors 为空导致无色
_zsh_ls_colors_default='no=00:fi=00:di=01;34:ln=01;36:pi=40;33:so=01;35:do=01;35:bd=40;33;01:cd=40;33;01:or=40;31;01:ex=01;32:*.tar=01;31:*.tgz=01;31:*.zip=01;31:*.gz=01;31:*.bz2=01;31:*.deb=01;31:*.rpm=01;31:*.jar=01;31:*.jpg=01;35:*.png=01;35:*.gif=01;35:*.svg=01;35'
zstyle ':completion:*' list-colors "${(s.:.)LS_COLORS:-$_zsh_ls_colors_default}"
zstyle ':completion:*' group-name ''                   # 所有匹配归入同一组，不显示分组标题
zstyle ':completion:*' insert-unambiguous true         # _match/_approximate 先插入无歧义前缀，找不到才进菜单补全
zstyle ':completion:*' verbose yes                     # 描述更详细

# ---- 布局微调 ----
zstyle ':completion:*' list-packed true               # 紧凑多列布局
zstyle ':completion:*' special-dirs true               # 允许补全 . 和 ..

# ---- 特殊场景 ----
zstyle ':completion:*:cd:*' ignore-parents parent pwd  # cd 时不显示 .. 和当前目录
zstyle ':completion:*:kill:*' command 'ps -u $USER -o pid,%cpu,cmd'  # kill 补全显示完整命令
zstyle ':completion:*:*:kill:*:processes' list-colors '=(#b) #([0-9]#)*=0=01;31'  # kill 列表 PID 列标红
''' }

"~/.zshrc/plugins" = { block = '''
zinit ice wait lucid
zinit light zdharma-continuum/fast-syntax-highlighting

zinit light zsh-users/zsh-autosuggestions
''' }

"~/.zshrc/path" = { block = '''
export PNPM_HOME="$HOME/.cache/pnpm"
path+=(
  "$PNPM_HOME/bin"
)
''' }

"~/.config/starship.toml" = { mode = "copy" }
"~/.gitconfig" = { mode = "copy" }
"~/.gitignore_global" = { mode = "copy" }

[tasks.generate-completions]
description = "生成常用工具的zsh补全"
run = '''
#!/usr/bin/env zsh
set -u

# 补全目录与缓存路径（未加载 dotfiles 时使用默认值兜底）
ZSH_COMPLETION_DIR="${ZSH_COMPLETION_DIR:-$HOME/.cache/zsh/site-functions}"
CONCURRENCY=8 # 并发上限，curl 下载较多，串行太慢

# 临时目录：所有补全先写到这里，全部跑完后再原子替换到目标目录
# 任务中途失败（Ctrl+C / 任意一步报错）都不会污染 $ZSH_COMPLETION_DIR
STAGING_DIR="$(mktemp -d -t zsh-completions)"
cleanup() {
    if [ -n "${STAGING_DIR:-}" ] && [ -d "$STAGING_DIR" ]; then
        rm -rf -- "$STAGING_DIR"
    fi
}
trap cleanup EXIT INT TERM

mkdir -p -- "$ZSH_COMPLETION_DIR"

echo "🔄 生成常用工具的zsh补全..."

CURL() {
    # 封装 curl 的重试 / 超时参数；用函数而非变量，避免 zsh 默认 SH_WORD_SPLIT 关闭导致
    # 不带引号的 $CURL 整串被当成命令名（这正是原 gen_completion 走 eval 才正常工作的原因）
    curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 20 "$@"
}

# 检测系统是否已经提供了某个工具的补全，并返回来源标识
# 输出 "brew"（homebrew 提供）/ "zsh"（系统 zsh 自带）/ 空字符串（未提供）
has_system_completion() {
    local name="$1"
    local brew_prefix
    brew_prefix="$(brew --prefix 2>/dev/null)" || brew_prefix=""

    # homebrew（Apple Silicon: /opt/homebrew；Intel: /usr/local）
    [ -n "$brew_prefix" ] && [ -f "$brew_prefix/share/zsh/site-functions/_$name" ] && { echo "brew"; return 0; }
    [ -n "$brew_prefix" ] && [ -f "$brew_prefix/share/zsh/$ZSH_VERSION/functions/_$name" ] && { echo "brew"; return 0; }

    # 系统 zsh 标准目录
    [ -f "/usr/share/zsh/$ZSH_VERSION/functions/_$name" ] && { echo "zsh"; return 0; }
    [ -f "/usr/share/zsh/site-functions/_$name" ] && { echo "zsh"; return 0; }
    [ -f "/usr/local/share/zsh/site-functions/_$name" ] && { echo "zsh"; return 0; }

    return 1
}

# 通用并发控制：超过上限时等待最早完成的任务
PENDING=0
spawn() {
    "$@" &
    PENDING=$((PENDING + 1))
    if (( PENDING >= CONCURRENCY )); then
        wait -n 2>/dev/null
        PENDING=$((PENDING - 1))
    fi
}

# 本地工具：依赖命令已存在；执行 `cmd` 把补全输出到目标文件
gen_local_completion() {
    local name="$1" cmd="$2"
    local target="$STAGING_DIR/_${name}"
    local source

    source="$(has_system_completion "$name")"
    if [[ -n "$source" ]]; then
        case "$source" in
            brew) echo "🍺 ${name} (brew)，跳过" ;;
            zsh)  echo "🐚 ${name} (zsh)，跳过" ;;
        esac
        return
    fi

    if ! [ -x "$(command -v "$name" 2>/dev/null)" ]; then
        echo "⏭️  ${name} 未安装，跳过"
        return
    fi

    if eval "$cmd" > "$target" 2>/dev/null && [[ -s "$target" ]]; then
        echo "✅ ${name} 补全脚本已生成"
    else
        rm -f -- "$target"
        echo "❌ ${name} 补全生成失败"
    fi
}

# 远程补全：从 URL 下载，不依赖本地命令是否存在（修复原版对 mlx_lm.* 等子命令的 bug）
fetch_url_completion() {
    local name="$1" url="$2"
    local target="$STAGING_DIR/_${name}"
    local source

    source="$(has_system_completion "$name")"
    if [[ -n "$source" ]]; then
        case "$source" in
            brew) echo "🍺 ${name} (brew)，跳过" ;;
            zsh)  echo "🐚 ${name} (zsh)，跳过" ;;
        esac
        return
    fi

    if ! [ -x "$(command -v "$name" 2>/dev/null)" ]; then
        echo "⏭️  ${name} 未安装，跳过"
        return
    fi

    if CURL "$url" -o "$target" 2>/dev/null && [[ -s "$target" ]]; then
        echo "✅ ${name} 补全脚本已下载"
    else
        rm -f -- "$target"
        echo "❌ ${name} 补全下载失败"
    fi
}

# ---- 本地命令补全（需要命令已安装） ----
spawn gen_local_completion mise "mise completion zsh"
spawn gen_local_completion hermes "hermes completion zsh"
spawn gen_local_completion aube "aube completion zsh"
spawn gen_local_completion bat "bat --completion zsh"
spawn gen_local_completion bun "bun completions zsh"
spawn gen_local_completion miniserve "miniserve --print-completions zsh"
spawn gen_local_completion deno "deno completions zsh"
spawn gen_local_completion fd "fd --gen-completions zsh"
spawn gen_local_completion gh "gh completion -s zsh"
spawn gen_local_completion opencode "opencode completion"
spawn gen_local_completion npm "npm completion"
spawn gen_local_completion pkl "pkl shell-completion zsh"
spawn gen_local_completion pnpm "pnpm completion zsh"
spawn gen_local_completion pip "pip completion --zsh"
spawn gen_local_completion rg "rg --generate complete-zsh"
spawn gen_local_completion usage "usage --completions zsh"
spawn gen_local_completion uv "uv generate-shell-completion zsh"
spawn gen_local_completion watchexec "watchexec --completions zsh"
spawn gen_local_completion yq "yq completion zsh"
spawn gen_local_completion pitchfork "pitchfork completion zsh"
spawn gen_local_completion hf "hf --show-completion"
spawn gen_local_completion container "container --generate-completion-script zsh"
spawn gen_local_completion lefthook "lefthook completion zsh"
spawn gen_local_completion kubectl "kubectl completion zsh"
spawn gen_local_completion witr "witr completion zsh"
spawn gen_local_completion xcbeautify "xcbeautify --generate-completion-script"

# ---- 远程补全（不依赖本地命令是否存在） ----
spawn fetch_url_completion dust "https://raw.githubusercontent.com/bootandy/dust/refs/heads/master/completions/_dust"
spawn fetch_url_completion yarn "https://raw.githubusercontent.com/zsh-users/zsh-completions/refs/heads/master/src/_yarn"
spawn fetch_url_completion claude "https://raw.githubusercontent.com/1160054/claude-code-zsh-completion/refs/heads/main/completions/_claude.zh-CN"
spawn fetch_url_completion mlx_lm.server "https://raw.githubusercontent.com/ftzahao/config/refs/heads/main/zsh-completion/mlx_lm.server/_mlx_lm.server.zh-CN"
spawn fetch_url_completion mlx_lm.chat "https://raw.githubusercontent.com/ftzahao/config/refs/heads/main/zsh-completion/mlx_lm.chat/_mlx_lm.chat.zh-CN"
spawn fetch_url_completion mlx_lm.dynamic_quant "https://raw.githubusercontent.com/ftzahao/config/refs/heads/main/zsh-completion/mlx_lm.dynamic_quant/_mlx_lm.dynamic_quant.zh-CN"

wait

# 统计 staging 中成功生成的文件数
success_count=$(ls -1 "$STAGING_DIR"/_* 2>/dev/null | wc -l | tr -d ' ')

if (( success_count == 0 )); then
    echo ""
    echo "❌ 没有任何补全生成成功，保留 $ZSH_COMPLETION_DIR 不变"
    exit 1
fi

# 原子替换：先清空旧的补全文件，再把 staging 中的内容移过去
# 这是脚本里唯一会动 $ZSH_COMPLETION_DIR 的地方
rm -f -- "$ZSH_COMPLETION_DIR"/_* 2>/dev/null
mv "$STAGING_DIR"/* "$ZSH_COMPLETION_DIR"/

# 清空 staging，让 trap 知道不需要再清理
rmdir "$STAGING_DIR" 2>/dev/null || rm -rf -- "$STAGING_DIR"
STAGING_DIR=""

echo ""
echo "✅ ${success_count} 个补全脚本已生成至 $ZSH_COMPLETION_DIR"

# 刷新补全缓存，让新补全对后续会话立即生效
fpath+=("$ZSH_COMPLETION_DIR")
autoload -Uz compinit && compinit
'''

[tasks.i-mise-cli]
description = "安装 mise 到 ~/.local/bin"
run = "curl https://mise.run | sh"

[tasks.mise-update]
description = "更新mise的包到最新版本"
run = "mise cache clear && mise upgrade --prune"

[tasks.i-x64]
description = "安装64位系统的工具包: mise run install-x64 [tool@version]"
env = { MISE_ARCH = "x86_64" }
run = "mise install"

[tasks.i-node-14-arm64]
description = "仅用于安装 arm64 版本的 Node 14（走非官方镜像源）"
env = { MISE_NODE_MIRROR_URL = "https://nodejs.raccoon-tw.dev/release/", MISE_NODE_VERIFY = 0 }
run = "mise install node@14"

[tasks.hf-i-mlx]
description = "使用 hf ci 下载模型到 ~/.cache/MLXModels"
run = '''
#!/usr/bin/env zsh

