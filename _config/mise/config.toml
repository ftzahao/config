export ZSH_COMPLETION_DIR="$HOME/.local/share/zsh/site-functions" # ZSH 补全脚本目录

function ensure_directory() {
  local dir="$1"
  if [ ! -d "$dir" ]; then
    mkdir -p -- "$dir" 2>/dev/null || {
      echo "Error: Failed to create directory '$dir'" >&2
      return 1
    }
  fi
