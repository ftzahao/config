#:tombi toml-version = "v1.1.0"

[tasks.generate-completions]
description = "生成常用工具的zsh补全"
run = '''
#!/usr/bin/env zsh
set -u

# 补全目录与缓存路径（未加载 dotfiles 时使用默认值兜底）
ZSH_FUNC=~/.local/share/zsh/site-functions
CONCURRENCY=8 # 并发上限，curl 下载较多，串行太慢

# 临时目录：所有补全先写到这里，全部跑完后再原子替换到目标目录
# 任务中途失败（Ctrl+C / 任意一步报错）都不会污染 $ZSH_FUNC
STAGING_DIR="$(mktemp -d -t zsh-completions)"
cleanup() {
    if [ -n "${STAGING_DIR:-}" ] && [ -d "$STAGING_DIR" ]; then
        rm -rf -- "$STAGING_DIR"
    fi
}
trap cleanup EXIT INT TERM

mkdir -p -- "$ZSH_FUNC"

echo "🔄 生成常用工具的zsh补全..."

CURL() {
    # 封装 curl 的重试 / 超时参数；用函数而非变量，避免 zsh 默认 SH_WORD_SPLIT 关闭导致
    # 不带引号的 $CURL 整串被当成命令名（这正是原 gen_completion 走 eval 才正常工作的原因）
    curl -fsSL --retry 2 --retry-delay 1 --connect-timeout 5 --max-time 20 "$@"
}

# 检测系统是否已经提供了某个工具的补全，并返回来源标识
# 输出 "brew"（homebrew 提供）/ "zsh"（系统 zsh 自带）/ 空字符串（未提供）
has_system_completion() {
    local name="$1"
    local brew_prefix
    brew_prefix="$(brew --prefix 2>/dev/null)" || brew_prefix=""

    # homebrew（Apple Silicon: /opt/homebrew；Intel: /usr/local）
    [ -n "$brew_prefix" ] && [ -f "$brew_prefix/share/zsh/site-functions/_$name" ] && { echo "brew"; return 0; }
    [ -n "$brew_prefix" ] && [ -f "$brew_prefix/share/zsh/$ZSH_VERSION/functions/_$name" ] && { echo "brew"; return 0; }

    # 系统 zsh 标准目录
    [ -f "/usr/share/zsh/$ZSH_VERSION/functions/_$name" ] && { echo "zsh"; return 0; }
    [ -f "/usr/share/zsh/site-functions/_$name" ] && { echo "zsh"; return 0; }
    [ -f "/usr/local/share/zsh/site-functions/_$name" ] && { echo "zsh"; return 0; }

    return 1
}

# 通用并发控制：超过上限时等待最早启动的任务
# 注意：zsh 没有 bash 的 wait -n（会报 "job not found" 且被静默吞掉），
# 导致并发上限失效、全部任务同时启动。改用 PID 队列：
# 始终 wait 最早启动的后台任务，完成后从队首移除。
# 另外：zsh 取数组长度写法是 $# 加变量名（如 $#PIDS），不能用美元符大括号井号
# 的形式——井号紧跟大括号会被 Tera 模板当成注释开头，导致整个任务无法解析。
PIDS=()
spawn() {
    "$@" &
    PIDS+=("$!")
    if (( $#PIDS >= CONCURRENCY )); then
        wait "${PIDS[1]}" 2>/dev/null || true
        PIDS[1]=()
    fi
}

# 本地工具：依赖命令已存在；执行 `cmd` 把补全输出到目标文件
gen_local_completion() {
    local name="$1" cmd="$2"
    local target="$STAGING_DIR/_${name}"
    local source

    source="$(has_system_completion "$name")"
    if [[ -n "$source" ]]; then
        case "$source" in
            brew) echo "🍺 ${name} (brew)，跳过" ;;
            zsh)  echo "🐚 ${name} (zsh)，跳过" ;;
        esac
        return
    fi

    if ! [ -x "$(command -v "$name" 2>/dev/null)" ]; then
        echo "⏭️  ${name} 未安装，跳过"
        return
    fi

    if eval "$cmd" > "$target" 2>/dev/null && [[ -s "$target" ]]; then
        echo "✅ ${name} 补全脚本已生成"
    else
        rm -f -- "$target"
        echo "❌ ${name} 补全生成失败"
    fi
}

# 远程补全：从 URL 下载，不依赖本地命令是否存在（修复原版对 mlx_lm.* 等子命令的 bug）
fetch_url_completion() {
    local name="$1" url="$2"
    local target="$STAGING_DIR/_${name}"
    local source

    source="$(has_system_completion "$name")"
    if [[ -n "$source" ]]; then
        case "$source" in
            brew) echo "🍺 ${name} (brew)，跳过" ;;
            zsh)  echo "🐚 ${name} (zsh)，跳过" ;;
        esac
        return
    fi

    if ! [ -x "$(command -v "$name" 2>/dev/null)" ]; then
        echo "⏭️  ${name} 未安装，跳过"
        return
    fi

    if CURL "$url" -o "$target" 2>/dev/null && [[ -s "$target" ]]; then
        echo "✅ ${name} 补全脚本已下载"
    else
        rm -f -- "$target"
        echo "❌ ${name} 补全下载失败"
    fi
}

# ---- 本地命令补全（需要命令已安装） ----
spawn gen_local_completion mise "mise completion zsh"
spawn gen_local_completion hermes "hermes completion zsh"
spawn gen_local_completion container "container --generate-completion-script zsh"
spawn gen_local_completion unsloth "unsloth --show-completion zsh"

# ---- 远程补全（不依赖本地命令是否存在） ----
spawn fetch_url_completion dust "https://raw.githubusercontent.com/bootandy/dust/refs/heads/master/completions/_dust"
spawn fetch_url_completion yarn "https://raw.githubusercontent.com/zsh-users/zsh-completions/refs/heads/master/src/_yarn"
spawn fetch_url_completion claude "https://raw.githubusercontent.com/1160054/claude-code-zsh-completion/refs/heads/main/completions/_claude.zh-CN"
spawn fetch_url_completion mlx_lm.awq "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.awq/_mlx_lm.awq-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.chat "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.chat/_mlx_lm.chat-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.dynamic_quant "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.dynamic_quant/_mlx_lm.dynamic_quant-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.generate  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.generate/_mlx_lm.generate-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.manage  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.manage/_mlx_lm.manage-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.share  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.share/_mlx_lm.share-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.benchmark  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.benchmark/_mlx_lm.benchmark-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.convert  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.convert/_mlx_lm.convert-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.evaluate  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.evaluate/_mlx_lm.evaluate-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.gptq  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.gptq/_mlx_lm.gptq-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.perplexity  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.perplexity/_mlx_lm.perplexity-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.upload  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.upload/_mlx_lm.upload-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.cache_prompt  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.cache_prompt/_mlx_lm.cache_prompt-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.dwq  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.dwq/_mlx_lm.dwq-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.fuse  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.fuse/_mlx_lm.fuse-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.lora  "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.lora/_mlx_lm.lora-zsh-zh_CN"
spawn fetch_url_completion mlx_lm.server "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/mlx_lm.server/_mlx_lm.server-zsh-zh_CN"
spawn fetch_url_completion llama "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama/_llama-zsh-zh_CN"
spawn fetch_url_completion llama-batched-bench "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-batched-bench/_llama-batched-bench-zsh-zh_CN"
spawn fetch_url_completion llama-bench "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-bench/_llama-bench-zsh-zh_CN"
spawn fetch_url_completion llama-cli "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-cli/_llama-cli-zsh-zh_CN"
spawn fetch_url_completion llama-completion "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-completion/_llama-completion-zsh-zh_CN"
spawn fetch_url_completion llama-cvector-generator "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-cvector-generator/_llama-cvector-generator-zsh-zh_CN"
spawn fetch_url_completion llama-download "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-download/_llama-download-zsh-zh_CN"
spawn fetch_url_completion llama-export-lora "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-export-lora/_llama-export-lora-zsh-zh_CN"
spawn fetch_url_completion llama-fit-params "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-fit-params/_llama-fit-params-zsh-zh_CN"
spawn fetch_url_completion llama-gguf-split "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-gguf-split/_llama-gguf-split-zsh-zh_CN"
spawn fetch_url_completion llama-imatrix "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-imatrix/_llama-imatrix-zsh-zh_CN"
spawn fetch_url_completion llama-mtmd-cli "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-mtmd-cli/_llama-mtmd-cli-zsh-zh_CN"
spawn fetch_url_completion llama-mtmd-debug "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-mtmd-debug/_llama-mtmd-debug-zsh-zh_CN"
spawn fetch_url_completion llama-perplexity "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-perplexity/_llama-perplexity-zsh-zh_CN"
spawn fetch_url_completion llama-quantize "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-quantize/_llama-quantize-zsh-zh_CN"
spawn fetch_url_completion llama-results "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-results/_llama-results-zsh-zh_CN"
spawn fetch_url_completion llama-server "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-server/_llama-server-zsh-zh_CN"
spawn fetch_url_completion llama-tokenize "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-tokenize/_llama-tokenize-zsh-zh_CN"
spawn fetch_url_completion llama-tts "https://cdn.jsdelivr.net/gh/ftzahao/config@main/terminal-completion/llama-tts/_llama-tts-zsh-zh_CN"

wait

# 统计 staging 中成功生成的文件数
success_count=$(ls -1 "$STAGING_DIR"/_* 2>/dev/null | wc -l | tr -d ' ')

if (( success_count == 0 )); then
    echo ""
    echo "❌ 没有任何补全生成成功，保留 $ZSH_FUNC 不变"
    exit 1
fi

# 原子替换：先清空旧的补全文件，再把 staging 中的内容移过去
# 这是脚本里唯一会动 $ZSH_FUNC 的地方
rm -f -- "$ZSH_FUNC"/_* 2>/dev/null
mv "$STAGING_DIR"/* "$ZSH_FUNC"/

# 清空 staging，让 trap 知道不需要再清理
rmdir "$STAGING_DIR" 2>/dev/null || rm -rf -- "$STAGING_DIR"
STAGING_DIR=""

echo ""
echo "✅ ${success_count} 个补全脚本已生成至 $ZSH_FUNC"
'''

[tasks.i-mise-cli]
description = "安装 mise 到 ~/.local/bin"
run = "curl https://mise.run | sh"

[tasks.i-x64]
description = "安装64位系统的工具包: mise run i-x64 [tool@version]"
env = { MISE_ARCH = "x86_64" }
run = "mise install"

[tasks.i-node-14-arm64]
description = "仅用于安装 arm64 版本的 Node 14（走非官方镜像源）"
env = { MISE_NODE_MIRROR_URL = "https://raw.githubusercontent.com/ftzahao/node14-apple-silicon-build/refs/heads/master/release/", MISE_NODE_VERIFY = 0 }
run = "mise install"
