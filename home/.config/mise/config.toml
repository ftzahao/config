[settings]
auto_install = false
experimental = true
lockfile = true
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go", "java"]
python.uv_venv_auto = "source"
trusted_config_paths = ["~"]

[tasks.generate-completions]
description = "生成所有常用工具的zsh补全"
run = '''
#!/usr/bin/env zsh
set -e

# 清理旧的补全文件，避免过期或冲突
rm -f -- $ZSH_COMPLETION_DIR/_* 2>/dev/null || true

echo "🔄 生成所有工具的zsh补全..."

# 辅助函数：检查命令是否存在并生成补全
gen_completion() {
    local name="$1"
    local cmd="$2"
    if [ -x "$(command -v "$name")" ]; then
        eval "$cmd" > "$ZSH_COMPLETION_DIR/_${name}" 2>/dev/null && echo "✅ ${name} 补全脚本已生成" || echo "❌ ${name} 补全生成失败"
    else
        echo "⏭️  ${name} 未安装，跳过"
    fi
}

gen_completion hermes "hermes completion zsh"
gen_completion aube "aube completion zsh"
gen_completion bat "bat --completion zsh"
gen_completion bun "bun completions zsh"
gen_completion miniserve "mise x miniserve -- miniserve --print-completions zsh"
gen_completion deno "deno completions zsh"
gen_completion fd "fd --gen-completions zsh"
gen_completion gh "gh completion -s zsh"
gen_completion opencode "opencode completion"
gen_completion npm "npm completion"
gen_completion pkl "mise x pkl -- pkl shell-completion zsh"
gen_completion pnpm "pnpm completion zsh"
gen_completion pip "pip completion --zsh"
gen_completion rg "mise x rg -- rg --generate complete-zsh"
gen_completion usage "mise x usage -- usage --completions zsh"
gen_completion uv "mise x uv -- uv generate-shell-completion zsh"
gen_completion watchexec "mise x watchexec -- watchexec --completions zsh"
gen_completion yq "yq completion zsh"
gen_completion pitchfork "mise x pitchfork -- pitchfork completion zsh"

echo ""
echo "✅ 所有补全内容已生成至 $ZSH_COMPLETION_DIR"
autoload -Uz compinit; compinit -d "$ZCOMPDUMP"
'''

[tasks.mise-update]
description = "更新mise的包到最新版本"
run = '''
#!/usr/bin/env zsh
set -e
mise cache clear && mise upgrade --bump && mise ls
'''

[tasks.install-x64]
description = "安装64位系统的工具包"
run = '''
#!/usr/bin/env zsh
set -e
export MISE_ARCH=x86_64
echo "🔧 安装 $MISE_ARCH 版本的 $1"
mise install "$1"
mise ls
'''
